<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMA | Join the Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e5e5; }
        .fade-in-up { animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Input Styles */
        input[type="text"], input[type="email"], select, textarea {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus, input[type="email"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: white;
        }
        select option { background-color: #0a0a0a; color: white; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-white selection:text-black">
    
    <nav class="fixed w-full z-50 bg-[#0a0a0a]/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-widest uppercase text-white">IMA.</a>
            <div class="space-x-8 text-sm font-medium tracking-wide">
                <a href="about.html" class="hover:text-white transition-colors duration-300 text-gray-400">The Science</a>
                <a href="join.html" class="text-white">Join the Elite</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-20 px-6 flex justify-center items-center">
        <div class="max-w-xl w-full fade-in-up">
            
            <h1 class="text-4xl font-bold tracking-tighter text-white mb-4 text-center">Verification Protocol</h1>
            <p class="text-gray-400 font-light text-center mb-12">Submit your credentials. Only the truly optimized will be accepted.</p>

            <form class="space-y-8" onsubmit="event.preventDefault(); alert('Transmission secure. The board will evaluate your micro-credentials.');">
                
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold tracking-widest uppercase text-gray-500 mb-2">Legal Name</label>
                        <input type="text" required class="w-full px-4 py-3 text-sm rounded-none focus:ring-0">
                    </div>
                    <div>
                        <label class="block text-xs font-bold tracking-widest uppercase text-gray-500 mb-2">Secure Email</label>
                        <input type="email" required class="w-full px-4 py-3 text-sm rounded-none focus:ring-0">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold tracking-widest uppercase text-gray-500 mb-2">Current Measurement (MM)</label>
                    <p class="text-xs text-gray-600 mb-3 italic">Precision matters. Please calibrate your calipers before answering.</p>
                    <select required class="w-full px-4 py-3 text-sm rounded-none focus:ring-0 appearance-none">
                        <option value="" disabled selected>Select your engineering tolerance...</option>
                        <option value="sub-10">Sub-10mm (Grand Master Class)</option>
                        <option value="10-25">10mm - 25mm (Elite)</option>
                        <option value="25-50">25mm - 50mm (Distinguished)</option>
                        <option value="50-88">50mm - 88.9mm (Standard IMA Tolerance)</option>
                        <option value="reject">89mm+ (Ineligible - Too much drag)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold tracking-widest uppercase text-gray-500 mb-2">Tactical Advantage</label>
                    <textarea required rows="4" placeholder="Describe a time your streamlined anatomy provided a definitive tactical advantage in a professional or athletic setting..." class="w-full px-4 py-3 text-sm rounded-none focus:ring-0 resize-none"></textarea>
                </div>

                <div class="flex items-start space-x-4">
                    <input type="checkbox" required id="confirm" class="mt-1 accent-white bg-transparent border-gray-600 w-4 h-4 rounded-none cursor-pointer">
                    <label for="confirm" class="text-sm text-gray-400 font-light cursor-pointer select-none">
                        I hereby swear under penalty of perjury that my equipment does not exceed the legal IMA limit of 3.5 inches on a warm day.
                    </label>
                </div>

                <button type="submit" class="w-full bg-white text-black py-4 text-sm font-bold tracking-widest uppercase hover:bg-gray-200 transition-colors duration-300">
                    Submit for Verification
                </button>
            </form>

        </div>
    </main>

    <footer class="py-8 border-t border-white/10 text-center text-xs text-gray-600 uppercase tracking-widest">
        &copy; 2026 International Micropenis Association. Strictly Confidential.
    </footer>
</body>
</html>
